# .github/workflows/ci.yml — stage-00 build and API tests (lockfile generated at next stage).
name: Checks
on:
  pull_request:
  push:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - run: npm install --no-audit --no-fund
      - run: npm run check
