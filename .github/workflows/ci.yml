# .github/workflows/ci.yml — both branch and PR validation; no database needed for isolated API tests.
name: Checks
on:
  pull_request:
  push:
    branches: [main, 'stage/**']
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - run: npm install --no-audit --no-fund
      - run: npm run check
