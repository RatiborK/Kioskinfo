# desktop/builder.yml — Windows installer and one-file portable EXE, each independently packaged.
appId: ru.kultura.navikultura
productName: НавиКультура
asar: true
compression: maximum
directories:
  output: dist
files:
  - main.cjs
  - preload.cjs
  - first-run.html
  - first-run.css
  - first-run.js
  - lib/**
  - bundled/**
  - package.json
  - node_modules/**
  - "!**/*.map"
  - "!**/*.test.*"
win:
  target:
    - target: portable
      arch: [x64]
    - target: nsis
      arch: [x64]
  signAndEditExecutable: false
portable:
  artifactName: "Navikultura-${version}-Portable-Windows-${arch}.${ext}"
nsis:
  artifactName: "Navikultura-${version}-Setup-Windows-${arch}.${ext}"
  oneClick: true
  perMachine: false
  allowElevation: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  deleteAppDataOnUninstall: false
